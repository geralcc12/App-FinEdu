name: aplicaciones_moviles
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.4.4

  # 🎨 UI & diseño
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # 📊 Reportes
  fl_chart: ^0.69.0      # Gráficos
  pdf: ^3.11.1           # Generar PDFs
  printing: ^5.13.3      # Imprimir/guardar PDFs
  excel: ^4.0.3          # Exportar a Excel (opcional)

  # ⚙️ Preferencias
  shared_preferences: ^2.2.2 # <--- AÑADIDO AQUÍ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
