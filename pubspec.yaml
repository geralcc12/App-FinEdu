name: aplicaciones_moviles
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Rango de SDK actualizado para compatibilidad

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 🔥 Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.4.4

  # 🎨 UI & diseño
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_markdown: ^0.7.1 # <--- ¡AÑADIDO PARA LECCIONES INTERACTIVAS!

  # 📊 Reportes
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.3
  excel: ^4.0.3

  # ⚙️ Funcionalidades
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
